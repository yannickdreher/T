name: Build

on:
  # Only the long-lived branches: a release tag points at a commit that was already built here,
  # and other branches are built through their pull request (no second run for the same commit).
  push:
    branches: [master, develop]
  # The first run of a new contributor needs a maintainer's approval.
  pull_request:

# A newer push to the same branch or pull request replaces the run that is still in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      shell: pwsh
      run: |
        dotnet restore T.UI/T.UI.csproj

    - name: Lint
      shell: pwsh
      run: |
        ./lint.ps1

    - name: Build
      shell: pwsh
      run: |
        dotnet build T.UI/T.UI.csproj -c Release --no-restore

    - name: Test
      shell: pwsh
      run: |
        dotnet test --project T.Tests/T.Tests.csproj -c Release

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: |
        dotnet restore T.UI/T.UI.csproj

    - name: Build
      run: |
        dotnet build T.UI/T.UI.csproj -c Release --no-restore

    - name: Test
      run: |
        dotnet test --project T.Tests/T.Tests.csproj -c Release
